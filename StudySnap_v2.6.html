<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudySnap — Learn Smarter</title>
<style>
:root{
  --bg:#f6f7ff; --card:#fff; --text:#182033; --muted:#687089;
  --primary:#6c63ff; --primary2:#8b5cf6; --cyan:#22c7d8;
  --pink:#ff6b9d; --green:#20b486; --yellow:#ffbd59;
  --border:#e7e8f2; --shadow:0 14px 40px rgba(35,35,75,.10);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.app{min-height:100vh}
.topbar{height:70px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;color:var(--primary)}
.logoMark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--pink));display:grid;place-items:center;color:#fff;box-shadow:0 7px 18px #6c63ff38}
.nav{display:flex;gap:8px}
.nav button{background:transparent;color:var(--muted);padding:10px 14px;border-radius:12px;font-weight:700}
.nav button.active,.nav button:hover{background:#f0efff;color:var(--primary)}
.profileMini{width:38px;height:38px;border-radius:50%;background:#eceaff;color:var(--primary);display:grid;place-items:center;font-weight:800}
.page{display:none;padding:34px 5% 60px;max-width:1200px;margin:auto}
.page.active{display:block}
.hero{border-radius:30px;padding:46px;min-height:330px;background:linear-gradient(120deg,#6258ff,#8b5cf6 48%,#ee70a5);color:white;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:#ffffff18;right:-60px;top:-70px}
.hero h1{font-size:clamp(36px,6vw,62px);line-height:1;margin:0 0 18px;max-width:650px}
.hero p{font-size:18px;line-height:1.6;max-width:620px;color:#f4f3ff}
.cta{background:#fff;color:var(--primary);padding:14px 20px;border-radius:14px;font-weight:900;margin-top:10px;box-shadow:0 8px 20px #00000018}
.sectionTitle{margin:38px 0 16px;font-size:25px}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feature,.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:0 8px 25px rgba(35,35,75,.05)}
.featureIcon{font-size:30px}
.feature h3{margin:12px 0 7px}.muted{color:var(--muted);line-height:1.55}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.quick button{padding:18px;background:#fff;border:1px solid var(--border);border-radius:18px;text-align:left;font-weight:800;color:var(--text);box-shadow:0 7px 20px rgba(35,35,75,.05)}
.quick button span{display:block;font-size:25px;margin-bottom:8px}
.quizHeader{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}
.badge{padding:7px 11px;border-radius:999px;background:#eceaff;color:var(--primary);font-weight:800;font-size:13px}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
label{font-weight:800;font-size:14px}
input,textarea,select{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:12px;margin-top:7px;outline:none;background:#fff;color:var(--text)}
textarea{min-height:190px;resize:vertical}
.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:13px 18px;border-radius:13px;font-weight:900}
.secondary{background:#f0efff;color:var(--primary);padding:13px 18px;border-radius:13px;font-weight:900}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.choice{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--border);padding:15px;border-radius:14px;margin:10px 0}
.choice:hover{border-color:#a49fff}.choice.correct{border-color:var(--green);background:#eafaf5}.choice.wrong{border-color:var(--pink);background:#fff0f5}
.quizQuestion{font-size:22px;line-height:1.45}.result{text-align:center;padding:25px}.score{font-size:55px;font-weight:950;color:var(--primary)}
.savedGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.savedCard{position:relative}.savedCard h3{margin:4px 0 8px}.savedMeta{font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:55px 20px;color:var(--muted)}
.profileLayout{display:grid;grid-template-columns:280px 1fr;gap:20px}
.avatar{width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--pink));color:white;display:grid;place-items:center;font-size:34px;font-weight:900;margin:auto auto 15px}
.profileSide{text-align:center}
.notice{padding:12px 14px;background:#fff7df;border:1px solid #ffe3a5;border-radius:12px;color:#795b18;margin-top:14px;font-size:13px}
footer{text-align:center;color:var(--muted);padding:30px}
@media(max-width:800px){
 .nav button{display:none}.features,.quick,.savedGrid,.profileLayout{grid-template-columns:1fr}
 .hero{padding:30px;min-height:360px}.formGrid{grid-template-columns:1fr}
 .topbar{padding:0 4%}
}

.quizNav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qnavWrap{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.qnav{width:34px;height:34px;border-radius:9px;background:#f1f1f8;color:var(--muted);font-weight:800}
.qnav.current{outline:2px solid var(--primary);color:var(--primary)}
.qnav.right{background:#dff8ee;color:#15835e}
.qnav.wrong{background:#ffe4ee;color:#c74775}
.reviewList{display:grid;gap:12px;margin-top:18px}
.reviewItem{background:#fff;border:1px solid var(--border);border-left:5px solid var(--primary);border-radius:14px;padding:16px}
.reviewCorrect{border-left-color:var(--green)} .reviewWrong{border-left-color:var(--pink)} .reviewUnanswered{border-left-color:var(--yellow)}
.reviewStatus{font-weight:900;margin-top:7px}
button:disabled{opacity:.45;cursor:not-allowed}

    .page-back{display:flex;align-items:center;gap:12px;margin:0 0 16px;font-weight:700}
    .page-back button{border:1px solid rgba(0,0,0,.12);background:#fff;padding:9px 14px;border-radius:12px;cursor:pointer}
    .page-back span{opacity:.75}


.splash-screen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6c63ff,#8f7cff,#5ed0c8);color:#fff;text-align:center;transition:opacity .45s ease,visibility .45s ease}
.splash-screen.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{width:92px;height:92px;border-radius:26px;background:#fff;color:#6c63ff;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;margin:0 auto 18px;box-shadow:0 12px 35px rgba(0,0,0,.18)}
.splash-name{font-size:42px;font-weight:900;letter-spacing:-1px}.splash-tag{margin-top:8px;opacity:.9;font-size:15px}
.home-menu{position:relative;margin-bottom:18px}
.menu-btn{width:48px;height:44px;border:0;border-radius:14px;background:#fff;box-shadow:0 5px 18px rgba(0,0,0,.1);font-size:22px;cursor:pointer}
.home-menu-panel{display:none;position:absolute;top:52px;left:0;z-index:50;width:190px;background:#fff;border-radius:16px;padding:8px;box-shadow:0 12px 35px rgba(0,0,0,.16)}
.home-menu-panel.open{display:block}.home-menu-panel button{width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:10px;cursor:pointer;font-size:14px}.home-menu-panel button:hover{background:#f1efff}
.home-intro{text-align:center;padding:28px 12px 22px}.home-brand{font-size:34px;font-weight:900;margin-bottom:8px}.home-sub{max-width:650px;margin:0 auto;color:#666;line-height:1.6}
.continue-btn{font-size:17px;padding:14px 28px;margin-top:22px}
.home-features{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}.home-feature{padding:18px;border-radius:18px;background:#f8f7ff}.home-feature strong{display:block;margin-bottom:5px}
@media(max-width:700px){.home-features{grid-template-columns:1fr}.splash-name{font-size:34px}}

</head>
<body>

<div id="splashScreen" class="splash-screen">
  <div>
    <div class="splash-logo">S</div>
    <div class="splash-name">StudySnap</div>
    <div class="splash-tag">Snap. Quiz. Learn.</div>
  </div>
</div>

<div class="app">
<header class="topbar">
  <div class="logo"><div class="logoMark">✦</div>StudySnap</div>
  <nav class="nav">
    <button id="navHome" class="active" onclick="showPage('home')">Home</button>
    <button id="navCreate" onclick="showPage('create')">Create Quiz</button>
    <button id="navSaved" onclick="showPage('saved')">Saved</button>
    <button id="navProfile" onclick="showPage('profile')">Profile</button>
  </nav>
  <button class="profileMini" onclick="showPage('profile')" id="miniAvatar">?</button>
</header>

<main>
<section id="home" class="page active">
  <div class="home-shell">
    <div class="home-top">
      <div class="home-menu">
        <button class="menu-btn" type="button" onclick="toggleHomeMenu()" aria-label="Open menu">☰</button>
        <div id="homeMenuPanel" class="home-menu-panel">
          <button type="button" onclick="showPage('saved');closeHomeMenu()">🔖 View Saved Quizzes</button>
          <button type="button" onclick="showPage('profile');closeHomeMenu()">👤 Profile</button>
        </div>
      </div>
    </div>

    <div class="home-intro-card">
      <div class="home-app-icon">S</div>
      <div class="home-brand">StudySnap</div>
      <p class="home-sub">Snap your notes, turn them into practice questions, review your answers and keep your quizzes ready for later.</p>
      <button class="cta continue-btn" onclick="showPage('create');closeHomeMenu()">Continue →</button>
    </div>

    <div class="home-features">
      <div class="home-feature"><strong>📷 Snap & Study</strong><span class="muted">Use photos, text or .txt notes.</span></div>
      <div class="home-feature"><strong>🧠 Smart Practice</strong><span class="muted">Choose subject, difficulty and question count.</span></div>
      <div class="home-feature"><strong>📚 Keep Learning</strong><span class="muted">Save quizzes and practise them again.</span></div>
    </div>
  </div>
</section>

<section id="create" class="page">
    <div class="page-back">
      <button type="button" onclick="showPage('home')">← Back</button>
      <span>Create Quiz</span>
    </div>

  <div class="quizHeader"><div><h1>Create a Quiz</h1><p class="muted">Give StudySnap some study material.</p></div><span class="badge">Practice mode</span></div>
  <div class="card">
    <div class="formGrid">
      <div>
        <label>📷 Upload a photo</label>
        <input type="file" id="photo" accept="image/*" onchange="previewPhoto(event)">
        <div id="photoPreview"></div>
      </div>
      <div>
        <label>📄 Upload a .txt file</label>
        <input type="file" id="txtFile" accept=".txt" onchange="loadTxt(event)">
        <p class="muted" style="font-size:13px">Or use the text box below.</p>
      </div>
    </div>
    <label style="display:block;margin-top:18px">✍️ Enter your notes</label>
    <textarea id="notes" placeholder="Paste your notes here..."></textarea>
    <div class="formGrid" style="margin-top:16px">
      <div>
        <label>📚 Subject</label>
        <select id="subject">
          <option value="biology">Biology</option>
          <option value="chemistry">Chemistry</option>
          <option value="physics">Physics</option>
          <option value="mathematics">Mathematics</option>
          <option value="cybersecurity">Cybersecurity</option>
          <option value="artificial intelligence">Artificial Intelligence</option>
          <option value="computing">Computing</option>
          <option value="english">English</option>
        </select>
      </div>
      <div><label>Question count</label><select id="count"><option>10</option><option>20</option><option>50</option><option>90</option></select></div>
      <div><label>Difficulty</label><select id="difficulty"><option>Mixed</option><option>Easy</option><option>Medium</option><option>Hard</option></select></div>
      <div><label>Language</label><select id="language"><option>English</option><option>Urdu</option></select></div>
      <div><label>Study mode</label><select id="mode"><option value="practice">Practice — no timer</option><option value="timed">Timed</option></select></div>
    </div>
    <div class="actions"><button class="primary" onclick="generateQuiz()">Generate Quiz ✨</button><button class="secondary" onclick="demo()">Try Demo</button></div>
    <p id="createStatus" class="muted"></p>
  </div>
</section>

<section id="quiz" class="page">
    <div class="page-back">
      <button type="button" onclick="showPage('create')">← Back</button>
      <span>Quiz</span>
    </div>

  <div class="quizHeader"><div><h1 id="quizTitle">Quiz</h1><p id="progress" class="muted"></p></div><span class="badge" id="quizBadge">StudySnap</span></div>
  <div class="card" id="quizCard"></div>
</section>

<section id="saved" class="page">
    <div class="page-back">
      <button type="button" onclick="showPage('home')">← Back</button>
      <span>Saved Quizzes</span>
    </div>

  <div class="quizHeader"><div><h1>Saved Quizzes 🔖</h1><p class="muted">Your quizzes stay on this device for now.</p></div></div>
  <div id="savedList" class="savedGrid"></div>
</section>

<section id="profile" class="page">
    <div class="page-back">
      <button type="button" onclick="showPage('home')">← Back</button>
      <span>Profile</span>
    </div>

  <div class="profileLayout">
    <div class="card profileSide">
      <div class="avatar" id="avatar">?</div>
      <h2 id="profileName">Your Profile</h2>
      <p class="muted" id="profileContact">Create a profile to personalise StudySnap.</p>
      <div class="notice">This version stores your profile and saved quizzes locally on your device. Real account sign-in can be connected later.</div>
    </div>
    <div class="card">
      <h2>Profile details</h2>
      <p class="muted">Use an email address or phone number to create your StudySnap profile.</p>
      <label>Name</label><input id="pName" placeholder="Your name">
      <label style="display:block;margin-top:14px">Email or phone number</label><input id="pContact" placeholder="Email or phone number">
      <div class="actions">
        <button class="primary" onclick="saveProfile()">Save profile</button>
        <button onclick="showPage('home')">← Back to Home</button>
      </div>
      <p id="profileStatus" class="muted"></p>
    </div>
  </div>
</section>
</main>
<footer>StudySnap • Learn smarter, one snap at a time ✦</footer>
</div>

<script>
let currentQuiz=[], currentIndex=0, score=0, answered=false, userAnswers=[];
let quizMode='practice', timeLeft=0, timerInterval=null, quizStarted=false, quizFinished=false;
const $=id=>document.getElementById(id);

function showPage(id){
  clearInterval(timerInterval);
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $(id).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  const map={home:'navHome',create:'navCreate',saved:'navSaved',profile:'navProfile'};
  if(map[id]) $(map[id]).classList.add('active');
  if(id==='saved') renderSaved();
  if(id==='profile') renderProfile();
  window.scrollTo({top:0,behavior:'smooth'});
}
function previewPhoto(e){const f=e.target.files[0];if(!f)return;$('photoPreview').innerHTML='<div class="notice">📷 '+escapeHtml(f.name)+' selected. The photo is ready for the AI image step.</div>';}
function loadTxt(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('notes').value=r.result};r.readAsText(f);}
function demo(){$('notes').value='Photosynthesis is the process by which green plants convert light energy into chemical energy. Chlorophyll absorbs light. Carbon dioxide and water are used to produce glucose and oxygen. The process mainly occurs in chloroplasts.';$('subject').value='Biology';$('count').value='10';$('mode').value='practice';$('createStatus').textContent='Demo material loaded — click Generate Quiz.';}

  const requested=parseInt($('count').value||10,10);

      {q:'Which gas is released as a product of photosynthesis?',a:['Nitrogen','Carbon dioxide','Oxygen','Hydrogen'],c:2,e:'Oxygen is released during photosynthesis.'},

      {q:'Where does glycolysis occur?',a:['Nucleus','Cytoplasm','Chloroplast','Golgi apparatus'],c:1,e:'Glycolysis takes place in the cytoplasm.'},
      {q:'Which organ pumps blood through the body?',a:['Liver','Heart','Lung','Kidney'],c:1,e:'The heart pumps blood through the circulatory system.'},

      {q:'Which is an example of a programming language?',a:['Python','HTTP','HTML tag','Wi-Fi'],c:0,e:'Python is a programming language.'},
      {q:'What is phishing?',a:['A social-engineering attack','A sorting algorithm','A storage device','A graphics format'],c:0,e:'Phishing is a social-engineering technique used to trick people into revealing information.'},
      {q:'What does AI commonly refer to?',a:['Artificial Intelligence','Automated Internet','Applied Input','Advanced Interface'],c:0,e:'AI stands for Artificial Intelligence.'},
      {q:'What does RAM provide?',a:['Temporary working memory','Permanent optical storage','Internet access','Power conversion'],c:0,e:'RAM provides temporary working memory for active programs and data.'},
      {q:'Which protocol is commonly used to load web pages securely?',a:['HTTPS','FTP','SMTP','SSH only'],c:0,e:'HTTPS is the secure HTTP protocol commonly used for web pages.'},
      {q:'What is an algorithm?',a:['A step-by-step procedure','A computer monitor','A file extension','A type of battery'],c:0,e:'An algorithm is a defined sequence of steps for solving a problem or performing a task.'},
      {q:'Which is a common database language?',a:['SQL','CSS','JPEG','PNG'],c:0,e:'SQL is widely used to query and manage relational databases.'}
    ]
  };
  let key=Object.keys(banks).find(k=>subject.includes(k));
  if(!key){if(subject.includes('bio'))key='biology';else if(subject.includes('chem'))key='chemistry';else if(subject.includes('phys'))key='physics';else if(subject.includes('math'))key='mathematics';else if(subject.includes('cyber')||subject.includes('ai')||subject.includes('computer'))key='computing';}
  if(!key)return [{q:'Which subject did you select?',a:[subject,'Biology','Chemistry','Physics'],c:0,e:'The offline prototype does not yet have a built-in bank for this subject. Connect the AI backend to generate questions from arbitrary material.'}];
  // The local fallback always returns exactly the requested number. It cycles through the built-in bank when more questions are requested.
  const bank=banks[key];
  return Array.from({length:requested},(_,i)=>{
    const base=bank[i%bank.length];
    return {...base,q:(i<bank.length?base.q:base.q+' (practice question '+(i+1)+')')};
  });
}

function generateQuiz(){
  const text=$('notes').value.trim(), photo=$('photo').files[0];
  if(!text&&!photo){$('createStatus').textContent='Add a photo or enter some notes first.';return;}
  const subject=$('subject').value;
  const difficulty=$('difficulty').value;
  const language=$('language').value;
  const count=parseInt($('count').value||10,10);
  $('createStatus').textContent=photo&&!text
    ?'Photo selected. Offline demo cannot read arbitrary photos yet, so using the '+difficulty.toLowerCase()+' '+language+' practice bank.'
    :'Preparing your '+difficulty.toLowerCase()+' '+subject+' quiz in '+language+'...';
  setTimeout(()=>startQuiz(getDifficultyQuestions(subject,difficulty,count),subject),250);
}

function startQuiz(qs,title){
  currentQuiz=qs;currentIndex=0;score=0;answered=false;quizFinished=false;quizStarted=true;
  userAnswers=qs.map(()=>({selected:null,answered:false,timedOut:false}));
  window.quizTitleForSave=title; quizMode=$('mode')?.value||'practice';
  clearInterval(timerInterval);
  timeLeft=getQuizSeconds(qs.length);
  $('quizTitle').textContent=title+' Quiz';
  $('quizBadge').textContent=quizMode==='timed'?'⏱ Timed':'Practice';
  showPage('quiz');
  renderQuestion();
  if(quizMode==='timed') startTimer();
}
function getQuizSeconds(count){if(count===10)return 10*60;if(count===20)return 15*60;if(count===50)return 30*60;if(count===90)return 40*60;return 0;}
function formatTime(sec){return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;}
function updateTimerDisplay(){const el=$('timerBox');if(!el)return;if(quizMode==='timed')el.textContent='⏱ '+formatTime(timeLeft);}
function startTimer(){
  clearInterval(timerInterval);
  if(quizMode!=='timed'||!timeLeft)return;
  updateTimerDisplay();
  timerInterval=setInterval(()=>{
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft<=0){clearInterval(timerInterval);timeLeft=0;autoFinishTimed();}
  },1000);
}
function autoFinishTimed(){
  userAnswers.forEach(s=>{if(!s.answered)s.timedOut=true;});
  finishQuiz(true);
}
function renderQuestion(){
  const q=currentQuiz[currentIndex], state=userAnswers[currentIndex]||{selected:null,answered:false,timedOut:false};
  answered=state.answered;
  $('progress').textContent=`Question ${currentIndex+1} of ${currentQuiz.length}`;
  const nav=currentQuiz.map((_,i)=>{const s=userAnswers[i];return `<button class="qnav ${i===currentIndex?'current':''} ${s?.answered?(s.selected===currentQuiz[i].c?'right':'wrong'):''}" onclick="goToQuestion(${i})">${i+1}</button>`;}).join('');
  const timer=quizMode==='timed'?`<div id="timerBox" class="badge">⏱ ${formatTime(timeLeft)}</div>`:'';
  const choices=q.a.map((x,i)=>{let cls='choice';if(state.answered&&i===q.c)cls+=' correct';if(state.answered&&state.selected===i&&i!==q.c)cls+=' wrong';return `<button class="${cls}" onclick="answer(${i})" ${state.answered?'disabled':''}>${String.fromCharCode(65+i)}. ${escapeHtml(x)}</button>`;}).join('');
  const feedback=state.answered?`<div id="feedback"><div class="notice"><b>${state.timedOut?'⏰ Time was up. ':state.selected===q.c?'Correct! 🎉 ':'Not quite. '}</b>${q.e}</div></div>`:'<div id="feedback"></div>';
  $('quizCard').innerHTML=`<div class="quizNav"><button class="secondary" onclick="goToQuestion(${Math.max(0,currentIndex-1)})" ${currentIndex===0?'disabled':''}>← Previous</button><div class="qnavWrap">${nav}</div><button class="secondary" onclick="goToQuestion(${Math.min(currentQuiz.length-1,currentIndex+1)})" ${currentIndex===currentQuiz.length-1?'disabled':''}>Next →</button></div><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:18px"><div class="quizQuestion">${escapeHtml(q.q)}</div>${timer}</div>${choices}${feedback}<div class="actions"><button class="secondary" onclick="showReview()">📋 Review Quiz</button><button class="secondary" onclick="saveCurrentQuiz()">🔖 Save Quiz</button><button class="secondary" onclick="confirmLeaveQuiz()">← Back</button></div><p id="saveStatus" class="muted"></p>`;
  updateTimerDisplay();
}
function answer(i,timeout=false){if(userAnswers[currentIndex]?.answered)return;const q=currentQuiz[currentIndex];userAnswers[currentIndex]={selected:i,answered:true,timedOut:timeout};score=userAnswers.reduce((n,s,j)=>n+(s?.selected===currentQuiz[j].c?1:0),0);renderQuestion();}
function nextQuestion(){if(currentIndex<currentQuiz.length-1){currentIndex++;renderQuestion();}else showReview();}
function goToQuestion(index){if(!currentQuiz.length)return;currentIndex=Math.max(0,Math.min(currentQuiz.length-1,index));quizFinished=false;renderQuestion();}
function showReview(){quizFinished=true;clearInterval(timerInterval);score=userAnswers.reduce((n,s,i)=>n+(s?.selected===currentQuiz[i].c?1:0),0);$('progress').textContent='Review';const pct=Math.round(score/currentQuiz.length*100);const rows=currentQuiz.map((q,i)=>{const s=userAnswers[i]||{};const status=!s.answered?(s.timedOut?'Timed out':'Not answered'):s.selected===q.c?'Correct':'Incorrect';const cls=s.selected===q.c?'reviewCorrect':!s.answered?'reviewUnanswered':'reviewWrong';return `<div class="reviewItem ${cls}"><div><b>Q${i+1}.</b> ${escapeHtml(q.q)}</div><div class="reviewStatus">${status}</div><div class="muted" style="margin-top:7px">${s.selected==null?'No answer':`Your answer: ${escapeHtml(q.a[s.selected])}`}<br>Correct answer: ${escapeHtml(q.a[q.c])}</div><button class="secondary" style="margin-top:10px" onclick="reviewQuestion(${i})">Review question</button></div>`;}).join('');$('quizCard').innerHTML=`<div class="result"><div class="score">${pct}%</div><h2>${score}/${currentQuiz.length} correct</h2><p class="muted">Choose a question below to review it.</p></div><div class="reviewList">${rows}</div><div class="actions" style="justify-content:center"><button class="primary" onclick="saveCurrentQuiz()">🔖 Save Quiz</button><button class="secondary" onclick="showPage('create')">New Quiz</button><button class="secondary" onclick="confirmLeaveQuiz()">← Back</button></div><p id="saveStatus" class="muted"></p>`;}
function reviewQuestion(i){currentIndex=i;quizFinished=false;renderQuestion();}
function saveCurrentQuiz(){const saved=JSON.parse(localStorage.getItem('studysnap_quizzes')||'[]');const title=$('quizTitle').textContent.replace(/ Quiz$/,'')||'My Quiz';saved.unshift({id:Date.now(),title,questions:currentQuiz,mode:quizMode,savedAt:new Date().toLocaleString()});localStorage.setItem('studysnap_quizzes',JSON.stringify(saved));const el=$('saveStatus');if(el)el.textContent='Saved! You can find it in Saved Quizzes.';}
function renderSaved(){const saved=JSON.parse(localStorage.getItem('studysnap_quizzes')||'[]');if(!saved.length){$('savedList').innerHTML='<div class="card empty" style="grid-column:1/-1">🔖<h2>No saved quizzes yet</h2><p>Create a quiz and tap “Save Quiz”.</p><button class="primary" onclick="showPage(\'create\')">Create a quiz</button></div>';return}$('savedList').innerHTML=saved.map(x=>`<div class="card savedCard"><span class="badge">${x.questions.length} questions</span><h3>${escapeHtml(x.title)}</h3><p class="savedMeta">Saved ${escapeHtml(x.savedAt)}</p><div class="actions"><button class="primary" onclick="loadSaved(${x.id})">Practise</button><button class="secondary" onclick="deleteSaved(${x.id})">Delete</button></div></div>`).join('');}
function loadSaved(id){const saved=JSON.parse(localStorage.getItem('studysnap_quizzes')||'[]'),x=saved.find(q=>q.id===id);if(x){$('mode').value=x.mode||'practice';startQuiz(x.questions,x.title);}}
function deleteSaved(id){const saved=JSON.parse(localStorage.getItem('studysnap_quizzes')||'[]').filter(q=>q.id!==id);localStorage.setItem('studysnap_quizzes',JSON.stringify(saved));renderSaved();}
function saveProfile(){const name=$('pName').value.trim(),contact=$('pContact').value.trim();if(!name||!contact){$('profileStatus').textContent='Please enter both your name and email/phone.';return}localStorage.setItem('studysnap_profile',JSON.stringify({name,contact}));renderProfile();$('profileStatus').textContent='Profile saved on this device.';}
function renderProfile(){const p=JSON.parse(localStorage.getItem('studysnap_profile')||'null');if(!p){$('avatar').textContent='?';$('profileName').textContent='Your Profile';$('profileContact').textContent='Create a profile to personalise StudySnap.';return}$('pName').value=p.name;$('pContact').value=p.contact;$('profileName').textContent=p.name;$('profileContact').textContent=p.contact;$('avatar').textContent=p.name.charAt(0).toUpperCase();$('miniAvatar').textContent=p.name.charAt(0).toUpperCase();}
function confirmLeaveQuiz(){if(!currentQuiz.length){showPage('create');return}if(confirm('Leave this quiz and return to Create Quiz? Your current quiz progress will not be saved.')){clearInterval(timerInterval);showPage('create');}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
renderProfile();

function hideSplash(){
  const splash=document.getElementById("splashScreen");
  if(splash) splash.classList.add("hide");
}
function toggleHomeMenu(){
  const p=document.getElementById("homeMenuPanel");
  if(p) p.classList.toggle("open");
}
function closeHomeMenu(){
  const p=document.getElementById("homeMenuPanel");
  if(p) p.classList.remove("open");
}

window.addEventListener("load",()=>setTimeout(hideSplash,2200));
function getDifficultyQuestions(subject,difficulty,count){
  const s=(subject||'').toLowerCase();
  const d=(difficulty||'mixed').toLowerCase();

  const banks={
    biology:[

    ],

    ],

      ['Which particle has a negative charge?',['Proton','Neutron','Electron','Nucleus'],2,'Electrons have negative charge.'],
      ['What is the approximate acceleration due to gravity?',['1.0 m/s²','4.9 m/s²','9.8 m/s²','98 m/s²'],2,'Near Earth, g is approximately 9.8 m/s².'],
      ['Which quantity has magnitude and direction?',['Mass','Temperature','Speed','Velocity'],3,'Velocity is a vector quantity.'],
      ['What is the approximate speed of light in vacuum?',['3×10⁸ m/s','3×10⁶ m/s','3×10⁴ m/s','3×10² m/s'],0,'Light travels at approximately 3×10⁸ m/s in vacuum.'],
      ['What happens to current if resistance increases at constant voltage?',['It increases','It decreases','It doubles','It stays the same'],1,'From I=V/R, current decreases when resistance increases.'],
      ['What type of energy does a moving object have?',['Potential','Kinetic','Chemical','Nuclear'],1,'Moving objects possess kinetic energy.'],
      ['What is the SI unit of resistance?',['Volt','Ampere','Ohm','Watt'],2,'Resistance is measured in ohms.']
    ],
    mathematics:[
      ['What is 12 × 8?',['86','96','108','112'],1,'12 × 8 = 96.'],
      ['What is √81?',['7','8','9','10'],2,'9 × 9 = 81.'],
      ['What is 15% of 200?',['15','20','30','40'],2,'0.15 × 200 = 30.'],
      ['If x + 7 = 12, what is x?',['3','4','5','6'],2,'Subtract 7 from both sides: x = 5.'],
      ['What is 2³?',['6','8','9','12'],1,'2³ = 8.'],
      ['What is 5²?',['10','15','20','25'],3,'5² = 25.'],
      ['What is 1/2 + 1/4?',['1/4','1/2','3/4','1'],2,'1/2 + 1/4 = 3/4.'],
      ['How many degrees are in a right angle?',['45°','90°','180°','360°'],1,'A right angle measures 90°.'],
      ['What is the perimeter of a square with side 5 cm?',['10 cm','15 cm','20 cm','25 cm'],2,'Perimeter = 4 × 5 = 20 cm.'],
      ['What is 100 ÷ 4?',['20','25','30','40'],1,'100 ÷ 4 = 25.']
    ],
    cybersecurity:[
      ['What is phishing?',['A deceptive attempt to obtain information','A storage device','A programming language','A backup method'],0,'Phishing uses deception to obtain information.'],
      ['What does MFA stand for?',['Multi-Factor Authentication','Main Firewall Access','Managed File Area','Multiple Folder Access'],0,'MFA uses multiple verification factors.'],

      ['What does VPN stand for?',['Virtual Private Network','Verified Public Network','Visual Protected Node','Virtual Personal Number'],0,'VPN stands for Virtual Private Network.'],
      ['What can a strong unique password help prevent?',['Typing errors','Unauthorized access','Slow internet','Screen damage'],1,'Strong unique passwords help protect accounts from unauthorized access.']
    ],
    artificialintelligence:[

      ['What is a dataset?',['A collection of data','A cable','A password','A processor'],0,'A dataset is a collection of data.'],
      ['What is a chatbot?',['A program that converses with users','A battery','A monitor','A cable'],0,'A chatbot is software designed to interact through conversation.'],
      ['What is computer vision?',['AI understanding images or video','Computer repair','Fast typing','Network security'],0,'Computer vision enables computers to process visual information.'],

      ['What is an algorithm?',['A step-by-step procedure','A screen','A virus','A battery'],0,'An algorithm is a defined sequence of steps.'],
      ['What is an AI model?',['A system trained to perform tasks from data','A keyboard','A cable','A browser'],0,'An AI model learns patterns from data to perform tasks.'],

      ['What is the opposite of hot?',['Warm','Cold','Heat','Fire'],1,'Cold is the opposite of hot.'],
      ['Which is a noun?',['Run','Beautiful','Teacher','Quickly'],2,'Teacher is a noun.'],
      ['Choose the correct article: ___ apple.',['A','An','The','No article'],1,'An is used before the vowel sound in apple.'],

      ['Which word means happy?',['Sad','Joyful','Angry','Tired'],1,'Joyful means happy.'],
      ['Which sentence is correct?',['She are happy.','She is happy.','She am happy.','She be happy.'],1,'She is happy is grammatically correct.'],

      ['Which word is an adjective?',['Quickly','Beauty','Beautiful','Run'],2,'Beautiful is an adjective.'],

  };

  const subjectKey=
    s.includes('bio')?'biology':
    s.includes('chem')?'chemistry':
    s.includes('phys')?'physics':
    s.includes('math')?'mathematics':
    s.includes('cyber')?'cybersecurity':
    s.includes('artificial')||s==='ai'?'artificialintelligence':
    s.includes('comput')?'computing':
    s.includes('english')?'english':'biology';

  let bank=banks[subjectKey]||banks.biology;

  // Shuffle the question order.
  const shuffled=[...bank].sort(()=>Math.random()-0.5);

  // Return exactly the requested number.
  // This local fallback cannot create genuinely new material-based questions yet.
  const out=[];
  for(let i=0;i<count;i++){
    const base=shuffled[i%shuffled.length];
    out.push({
      q:base[0],
      a:[...base[1]],
      c:base[2],
      e:base[3]
    });
  }

  return out;
                      }
